<style>
:root{--g:#3f5a2a;--gd:#2b3d1c;--au:#c9a227;--bg:#e6e4d4;--c:#f5f3e6;--t:#1b2314;--m:#5d6650;--b:#a9ad90;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d140c;--c:#162013;--t:#e9eddc;--m:#9ba98a;--b:#3a4a30}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 "Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(180deg,var(--gd),var(--g));color:#fff;padding:16px;display:flex;gap:14px;align-items:center;border-bottom:4px solid var(--au)}header img{width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid var(--au)}header h1{font-size:20px;margin:0;letter-spacing:2px;text-transform:uppercase}header small{display:block;color:#e8dca8;letter-spacing:1px;text-transform:uppercase;font-size:11px}
nav{display:flex;gap:0;padding:14px 16px 0;max-width:760px;margin:auto}nav button{flex:1;padding:12px;border:1px solid var(--g);background:var(--c);color:var(--g);font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}nav button.on{background:var(--g);color:#fff;border-bottom:3px solid var(--au)}
main{max-width:760px;margin:auto;padding:0 16px 40px}.card{background:var(--c);border:1px solid var(--b);border-top:3px solid var(--g);padding:18px;box-shadow:0 2px 0 var(--au)}
label{display:block;font-weight:700;margin:14px 0 4px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--g)}label span{float:right;font-weight:400;direction:rtl;color:var(--m);font-size:14px;letter-spacing:0;text-transform:none}
input,select{width:100%;padding:11px;border:1px solid var(--b);border-radius:2px;background:var(--bg);color:var(--t);font-size:16px}input:focus,select:focus{outline:2px solid var(--au)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.row{grid-template-columns:1fr}}
.btn{margin-top:20px;width:100%;padding:14px;border:0;border-bottom:3px solid var(--au);background:var(--g);color:#fff;font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase}.btn.s{background:#1f7a3a}.btn.o{background:none;color:var(--g);border:1px solid var(--g);margin-top:10px}
#pv{width:104px;height:134px;object-fit:cover;border:2px solid var(--au);display:none;margin-top:8px}.msg{margin-top:12px;color:var(--m);font-size:14px}.hide{display:none}
.m{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--b)}.m button{padding:8px 14px;border:1px solid var(--g);color:var(--g);background:none;font-weight:700}
.pbtn{display:block;text-align:center;padding:14px;border:2px dashed var(--g);color:var(--g);font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin:0}#pr{width:100%;display:block;border:1px solid var(--b);margin-top:8px}
html{background:#0a120a}body{background:transparent!important}#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
header{background:linear-gradient(180deg,rgba(20,30,14,.88),rgba(43,61,28,.78))!important;backdrop-filter:blur(6px);position:relative}
main{perspective:1400px}.card{background:rgba(245,243,230,.95)!important;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out;box-shadow:0 28px 60px rgba(0,0,0,.55),0 3px 0 var(--au)!important;transform-style:preserve-3d}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .card{background:rgba(22,32,19,.94)!important}}
nav button{box-shadow:0 6px 14px rgba(0,0,0,.4)}.btn{background:linear-gradient(#4f6d35,var(--g));border-bottom:3px solid var(--au);box-shadow:0 6px 0 #1b2611,0 12px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .08s ease,box-shadow .08s ease}.btn.s{background:linear-gradient(#2f9a50,#1f7a3a)}.btn.o{background:linear-gradient(#f6f4e4,#e4e1c8);color:var(--g);border:1px solid var(--g);border-bottom:4px solid #a9ad90;box-shadow:0 5px 0 #9a9e80,0 10px 16px rgba(0,0,0,.28),inset 0 1px 0 #fff}.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #1b2611,0 4px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2)}.btn.o:active:not(:disabled){box-shadow:0 1px 0 #9a9e80,0 3px 6px rgba(0,0,0,.25),inset 0 1px 0 #fff}.btn:disabled{opacity:.6}#f label{color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(90deg,#9c7412,#e4b848 30%,#fff2b8 50%,#e4b848 70%,#9c7412);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 0 #4a3606) drop-shadow(0 3px 2px rgba(0,0,0,.35));animation:goldShine 4s linear infinite,goldFloat 3s ease-in-out infinite}#f label span{color:#d9ad3a;-webkit-text-fill-color:#d9ad3a}@keyframes goldShine{from{background-position:100% 0}to{background-position:-100% 0}}@keyframes goldFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@media (prefers-reduced-motion:reduce){#f label{animation:none}}
.fab{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px 11px;font-size:11px;letter-spacing:1px;text-transform:uppercase;background:rgba(20,30,14,.75);color:#e8dca8;border:1px solid var(--au);border-radius:14px;opacity:.8;z-index:5}
/* NPCIH-A production refinement: charcoal + champagne-gold 3D buttons */
:root{--lux-charcoal:#242629;--lux-deep:#151719;--lux-gold:#d6b879;--lux-gold-light:#f2e2b9;--lux-ivory:#f7f4ec}
.card{background:rgba(247,244,236,.86)!important;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);color:#242629!important}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .card{background:rgba(247,244,236,.84)!important;color:#242629!important}}
/* Apply consistently to public, form, member-list and admin action buttons */
button,.btn,nav button,.m button,.pbtn,input[type=button],input[type=submit],input[type=reset],a.button,[role=button]{
  box-sizing:border-box;
  background:linear-gradient(180deg,#44474a 0%,#292b2e 48%,#191b1d 100%)!important;
  color:var(--lux-gold-light)!important;
  border:1px solid var(--lux-gold)!important;
  border-bottom:4px solid #9d7d3d!important;
  border-radius:10px!important;
  box-shadow:0 5px 0 #101112,0 9px 16px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.19),inset 0 -2px 0 rgba(0,0,0,.25)!important;
  font-weight:700;
  text-shadow:0 1px 1px rgba(0,0,0,.5);
  transition:transform .12s ease,box-shadow .12s ease,filter .12s ease,background .12s ease;
  -webkit-tap-highlight-color:transparent;
}
button:hover,.btn:hover,nav button:hover,.m button:hover,.pbtn:hover,input[type=button]:hover,input[type=submit]:hover,input[type=reset]:hover,a.button:hover,[role=button]:hover{
  background:linear-gradient(180deg,#5a5140 0%,#35312a 48%,#202020 100%)!important;
  filter:brightness(1.08);
  transform:translateY(-1px);
}
button:active:not(:disabled),.btn:active:not(:disabled),nav button:active:not(:disabled),.m button:active:not(:disabled),.pbtn:active,input[type=button]:active,input[type=submit]:active,input[type=reset]:active,a.button:active,[role=button]:active{
  transform:translateY(3px);
  border-bottom-width:1px!important;
  box-shadow:0 2px 0 #101112,0 3px 7px rgba(0,0,0,.25),inset 0 1px 2px rgba(0,0,0,.25)!important;
}
button:focus-visible,.btn:focus-visible,nav button:focus-visible,.m button:focus-visible,.pbtn:focus-visible,input[type=button]:focus-visible,input[type=submit]:focus-visible,input[type=reset]:focus-visible,a.button:focus-visible,[role=button]:focus-visible{
  outline:3px solid #f2e2b9!important;outline-offset:3px
}
button:disabled,.btn:disabled,input[type=button]:disabled,input[type=submit]:disabled{opacity:.62;cursor:not-allowed;filter:saturate(.55)}
nav button.on{background:linear-gradient(180deg,#d9bd7e,#a88746)!important;color:#202124!important;border-bottom-color:#6e5528!important;text-shadow:none}
.btn.s{background:linear-gradient(180deg,#e4cb91,#b99754)!important;color:#202124!important;border-bottom-color:#80632e!important;text-shadow:none}
.btn.o{background:linear-gradient(180deg,#44474a,#202124)!important;color:var(--lux-gold-light)!important;border-color:var(--lux-gold)!important;border-bottom-color:#9d7d3d!important}
.fab{background:linear-gradient(180deg,#44474a,#202124)!important;color:var(--lux-gold-light)!important;border:1px solid var(--lux-gold)!important;box-shadow:0 4px 0 #101112,0 8px 14px rgba(0,0,0,.3)!important}
@media(max-width:520px){button,.btn,nav button,.m button,.pbtn,input[type=button],input[type=submit],input[type=reset],a.button,[role=button]{border-radius:9px!important;box-shadow:0 4px 0 #101112,0 7px 12px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.16)!important}}
@media(prefers-reduced-motion:reduce){button,.btn,nav button,.m button,.pbtn,input[type=button],input[type=submit],input[type=reset],a.button,[role=button]{transition:none!important}}
